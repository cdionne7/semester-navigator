name: Windows portable install

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Parse Windows helper scripts
        shell: powershell
        run: |
          @(
            ".\scripts\install-windows.ps1",
            ".\scripts\setup-windows.ps1",
            ".\scripts\run-semester.ps1",
            ".\scripts\update-semester-navigator.ps1"
          ) | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_ -Raw))
          }
      - name: Archive this exact revision without Git metadata
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "semester-source.zip"
          & git archive --format=zip --prefix=semester-navigator/ --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Interrupt install and resume in a fresh process without Git, Node, or npm on PATH
        shell: powershell
        run: |
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $archive = Join-Path $env:RUNNER_TEMP "semester-source.zip"
          $destination = Join-Path $env:RUNNER_TEMP "Semester Navigator fresh install"
          $installer = Join-Path $env:GITHUB_WORKSPACE "scripts\install-windows.ps1"
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:NPM_CONFIG_OFFLINE = "true"
          $env:NPM_CONFIG_CACHE = Join-Path $env:RUNNER_TEMP "semester-intentionally-empty-cache"
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $installer -Destination $destination -SourceArchivePath $archive
          if ($LASTEXITCODE -eq 0) { throw "The intentional dependency failure did not stop installation." }
          $statePath = Join-Path $destination ".semester-navigator-template-state.json"
          if (-not (Test-Path -LiteralPath $statePath)) { throw "Interrupted installation lost its baseline." }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          if ($state.verified -ne $false) { throw "Failed installation was marked verified." }
          Remove-Item Env:NPM_CONFIG_OFFLINE
          Remove-Item Env:NPM_CONFIG_CACHE
          & $powershell -NoProfile -ExecutionPolicy Bypass -File $installer -Destination $destination -SourceArchivePath $archive
          if ($LASTEXITCODE -ne 0) { throw "Resuming the same installation failed." }
          $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
          if ($state.verified -ne $true) { throw "The resumed installation was not verified." }
          $checkpoint = Get-Content -LiteralPath (Join-Path $destination ".semester-navigator-install.json") -Raw | ConvertFrom-Json
          if ($checkpoint.status -ne "ready") { throw "The installation checkpoint did not reach ready." }
          if (Test-Path -LiteralPath (Join-Path $destination ".git")) { throw "The ZIP installation contains Git history." }
          $env:SEMESTER_TEST_INSTALLATION = $destination
          "SEMESTER_TEST_INSTALLATION=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run portable launcher and lint from another fresh shell
        shell: powershell
        run: |
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $destination = $env:SEMESTER_TEST_INSTALLATION
          $launcher = Join-Path $destination "scripts\run-semester.ps1"
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          $quotedLauncher = "'" + $launcher.Replace("'", "''") + "'"
          $quotedRoot = "'" + $destination.Replace("'", "''") + "'"
          & $powershell -NoProfile -ExecutionPolicy Bypass -Command "& $quotedLauncher -ProjectRoot $quotedRoot -Command npm -CommandArguments @('--version')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $powershell -NoProfile -ExecutionPolicy Bypass -Command "& $quotedLauncher -ProjectRoot $quotedRoot -Command npm -CommandArguments @('run', 'lint')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify legacy student migration with the portable runtime
        shell: powershell
        run: |
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $destination = $env:SEMESTER_TEST_INSTALLATION
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          $quotedLauncher = "'" + (Join-Path $destination "scripts\run-semester.ps1").Replace("'", "''") + "'"
          $quotedRoot = "'" + $destination.Replace("'", "''") + "'"
          if (-not (Test-Path -LiteralPath (Join-Path $destination "reviews\fixtures\legacy-501ddd-source.json"))) { throw "The native migration fixture is missing." }
          & $powershell -NoProfile -ExecutionPolicy Bypass -Command "& $quotedLauncher -ProjectRoot $quotedRoot -Command node -CommandArguments @('--test', 'tests/student-migration.test.mjs')"
          if ($LASTEXITCODE -ne 0) { throw "Legacy student migration failed on Windows." }
      - name: Create an upload-only student and start without the original template
        shell: powershell
        run: |
          $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $destination = $env:SEMESTER_TEST_INSTALLATION
          $student = Join-Path $env:RUNNER_TEMP "Independent student workspace"
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          $quotedLauncher = "'" + (Join-Path $destination "scripts\run-semester.ps1").Replace("'", "''") + "'"
          $quotedRoot = "'" + $destination.Replace("'", "''") + "'"
          $quotedStudent = "'" + $student.Replace("'", "''") + "'"
          $bootstrap = "& $quotedLauncher -ProjectRoot $quotedRoot -Command bootstrap -CommandArguments @('--student-root',$quotedStudent,'--profile-id','student-ci-example','--display-name','Example','--school','Test school','--semester','Fall 2026','--timezone','America/New_York','--age-eligible','yes','--prepare','no')"
          & $powershell -NoProfile -ExecutionPolicy Bypass -Command $bootstrap
          if ($LASTEXITCODE -ne 0) { throw "Upload-only bootstrap failed." }
          if (Test-Path -LiteralPath (Join-Path $student "node_modules")) { throw "Student setup unexpectedly installed build dependencies." }
          $movedTemplate = "$destination temporarily unavailable"
          Move-Item -LiteralPath $destination -Destination $movedTemplate
          try {
            $studentLauncher = "'" + (Join-Path $student "scripts\run-semester.ps1").Replace("'", "''") + "'"
            & $powershell -NoProfile -ExecutionPolicy Bypass -Command "& $studentLauncher -ProjectRoot $quotedStudent -Command start -CommandArguments @('--check')"
            if ($LASTEXITCODE -ne 0) { throw "The student workspace depends on the original template or cannot open its prebuilt dashboard." }
          } finally {
            Move-Item -LiteralPath $movedTemplate -Destination $destination
          }
