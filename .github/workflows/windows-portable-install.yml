name: Windows portable install

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  portable-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install with no Git, Node, or npm on PATH
        shell: powershell
        run: |
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & ".\scripts\setup-windows.ps1" -ProjectRoot "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & npm run lint
